@if (users.length !== 0) {
<h2>User List</h2>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Age</th>
    </tr>
  </thead>
  <tbody>
    @for (user of users; track user) {
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.phone }}</td>
      <td>{{ user.age }}</td>
    </tr>
    }
  </tbody>
</table>
}
