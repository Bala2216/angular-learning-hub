<div class="employee-container">

  <!-- 🔘 Toggle Button -->
  <button class="toggle-btn" (click)="toggleView()">
    {{ showForm ? 'Back to Employee List' : 'Add New Employee' }}
  </button>

  <!-- 🧍 Employee Form -->
  @if(showForm) {
    <div class="employee-form-container">
      <h2>Add New Employee</h2>

      <app-employee-form-component (employeeAdded)="handleAddEmployee($event)"></app-employee-form-component>
    </div>
  }


  <!-- 📋 Employee Table -->
  @if(!showForm) {
  <app-employee-list-component [employees]="employeeList" (deleteRow)="handleDelete($event)"></app-employee-list-component>
}


</div>
