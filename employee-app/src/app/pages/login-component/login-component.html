<div id="login-screen" class="screen">
  <h2>Login</h2>
  <form id="login-form">
      <input type="text" id="username" [(ngModel)]="loginObj.username" name="user" placeholder="Username" required>
      <input type="password" id="password" [(ngModel)]="loginObj.password" name="password"  placeholder="Password" required>
      <button type="submit" (click)="onLogin()">Login</button>
  </form>
</div>
