<form (ngSubmit)="onSubmit()">
  <h2>Employee Feedback Form</h2>
  <jsonforms
    [schema]="schema"
    [uischema]="uischema"
    [(data)]="data"
    [renderers]="renderers"
    (errors)="onErrors($event)"
  ></jsonforms>

  <button type="submit" [disabled]="!data">Submit</button>
</form>

@if(submittedForm) {
  <div>
    <h3>Submitted Form Data</h3>
  <pre>{{ submittedForm | json }}</pre>
</div>
}
<div *ngIf="!data" class="error-message">
  Please correct the errors in the form before submitting.
