<app-search (search)="onSearch($event)"></app-search>

<div *ngIf="loading$ | async">Loading...</div>

@for (card of data$ | async; track card.id) {
  <mat-card style="margin: 10px;">
    <img mat-card-image [src]="card.photoUrl" alt="{{ card.name }}" />
    <mat-card-title>{{ card.name }}</mat-card-title>
    <mat-card-subtitle>{{ card.username }}</mat-card-subtitle>
    <mat-card-content>{{ card.email }}</mat-card-content>
  </mat-card>
} @empty {
  <p>No results found.</p>
}
