<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

    <form [formGroup]="form" (ngSubmit)="register()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Username</label>
        <input
          formControlName="username"
          type="text"
          class="mt-1 block w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input
          formControlName="password"
          type="password"
          class="mt-1 block w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Role</label>
        <select
          formControlName="role"
          class="mt-1 block w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button
        type="submit"
        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition"
      >
        Register
      </button>
      @if(errorMessage){
      <div class="text-red-600 text-sm mt-2">
        {{ errorMessage }}
      </div>
      } @if(form.get('username')?.invalid && form.get('username')?.touched){
      <div class="text-red-600 text-sm">Username is required</div>
      }
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account?
      <button
        routerLink="/login"
        (click)="login()"
        class="text-green-600 hover:underline"
      >
        Login
      </button>
    </p>
  </div>
</div>
