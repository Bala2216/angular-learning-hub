<div class="card-grid">
<mat-card *ngFor="let user of users" class="user-card">
  <mat-card-header>
    <mat-card-title>{{ user.name }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p> <b>Name:</b> {{ user.name }}</p>
    <p> <b>Title:</b> {{ user.title }}</p>
    <p> <b>City:</b> {{ user.city }}</p>
  </mat-card-content>
</mat-card>
</div>
