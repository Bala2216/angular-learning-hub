<div class="p-4 space-y-4">
  <h1 class="text-2xl font-bold">AG Grid Demo</h1>

  <div class="grid grid-cols-4 gap-4">
    <input [(ngModel)]="newRecord.name" placeholder="Name" class="border p-2 rounded" />
    <input [(ngModel)]="newRecord.age" type="number" placeholder="Age" class="border p-2 rounded" />
    <input [(ngModel)]="newRecord.email" placeholder="Email" class="border p-2 rounded" />
    <button (click)="addRecord()" class="bg-blue-500 text-white px-4 py-2 rounded">Add Record</button>
  </div>

  <ag-grid-angular
    class="ag-theme-alpine h-[500px]"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [pagination]="true"
    [paginationPageSize]="paginationPageSize"
    (cellValueChanged)="onCellValueChanged($event)">
  </ag-grid-angular>
</div>
