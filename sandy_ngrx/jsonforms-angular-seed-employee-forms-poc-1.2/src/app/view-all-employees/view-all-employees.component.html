<div class="mt-4 ms-4">
  <h2>All Employees</h2>

  <div *ngIf="loading$ | async" class="mt-3">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span class="ms-2">Loading employees...</span>
  </div>

  <div *ngIf="error$ | async as error" class="alert alert-danger mt-3">
    Error: {{ error }}
  </div>

  <div *ngIf="(users$ | async) as users" class="mt-4">
    <div *ngIf="users.length > 0; else noUsers" class="d-flex flex-wrap" style="display: inline-flex;">
      <div
        class="card d-flex me-4 mb-4"
        *ngFor="let user of users"
        [style.backgroundColor]="user.gender === 'Female' ? 'pink' : 'lightblue'"
      >
        <i
          class="bi display-3"
          [ngClass]="{
            'bi-person-standing-dress': user.gender === 'Female',
            'bi-person-fill': user.gender === 'Male'
          }"
          style="font-size: 3.5rem"
        ></i>
        <div class="d-flex flex-column align-items-start text-start">
          <span class="detail">Name: {{ user.name }}</span>
          <span class="detail">Email: {{ user.email }}</span>
          <span class="detail">City: {{ user.address.city }}</span>
          <span class="detail">Gender: {{ user.gender }}</span>
        </div>

        <div *ngIf="(userPostsMap$ | async) as postsMap" class="mt-4">
          <div *ngIf="postsMap[user.id] && postsMap[user.id].length > 0">
            <span>Posts:</span>
            <ul>
              <li *ngFor="let post of postsMap[user.id]">
                <div><strong>{{ post.title }}</strong></div>
                <span>{{ post.body }}</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <ng-template #noUsers>
      <div *ngIf="!(loading$ | async)" class="mt-5">
        <p class="text-danger">No employees found</p>
      </div>
    </ng-template>
  </div>
</div>
