<div class="user-list-container">
  <div class="search-box" *ngIf="role === 'Admin'">
    <div class="search-add-wrapper">
      <app-input [(searchText)]="searchText" (searchTextChange)="onSearchChange($event)"></app-input>
      <button class="add-user-button" (click)="toggleAddForm()">+ Add User</button>
      <button class="clear-user-button" (click)="clearPersistedUsers()">Clear Added Users</button>
    </div>
  </div>

  <div class="modal-backdrop" *ngIf="showAddForm">
    <div class="modal-content">
      <h2>Add New User</h2>
      <input [(ngModel)]="newUser.name" placeholder="Name" />
      <input [(ngModel)]="newUser.username" placeholder="Username" />
      <input [(ngModel)]="newUser.email" placeholder="Email" />
      <textarea [(ngModel)]="newUser.body" placeholder="Comment"></textarea>
      <div class="modal-actions">
        <button (click)="onAddUser()">Save</button>
        <button class="cancel" (click)="toggleAddForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="user-cards">
    <div
      class="user-card boxed"
      *ngFor="let user of users | userFilter: searchText"
      [appGenderColor]="user.email"
      [title]="user.email.split('@')[1]"
    >
      <h3>{{ user.name }}</h3>
      <p><strong>Username:</strong> {{ user.username }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Comment:</strong> {{ user.body }}</p>
    </div>
  </div>

<div class="ag-grid-wrapper" style="margin: 20px 0;">
  <ag-grid-angular
    class="ag-theme-alpine"
    style="width: 100%; height: 400px;"
    [rowData]="users"
    [columnDefs]="agGridColumnDefs"
    [defaultColDef]="agGridDefaultColDef"
    [pagination]="true"
    [paginationPageSize]="10"
  ></ag-grid-angular>
</div>

<div class="mat-table-wrapper" style="margin: 20px 0;">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" multiTemplateDataRows>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Username</th>
      <td mat-cell *matCellDef="let user">{{ user.username }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>
    <ng-container matColumnDef="body">
      <th mat-header-cell *matHeaderCellDef>Comment</th>
      <td mat-cell *matCellDef="let user">{{ user.body }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="matDisplayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: matDisplayedColumns;"></tr>
  </table>
</div>
</div>
