<div class="user-list-container">
  <div class="search-box">
    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search users..."
      class="search-input"
    />
  </div>

  <div class="user-cards">
    <div
      class="user-card"
      *ngFor="let user of users | userFilter: searchText"
      [appGenderColor]="user.gender"
    >
      <h3>{{ user.name }}</h3>
      <p><strong>Gender:</strong> {{ user.gender }}</p>
      <p><strong>Date:</strong> {{ user.date }}</p>
    </div>
  </div>
</div>
