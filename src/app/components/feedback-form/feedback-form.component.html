<h3>Feedback Form</h3>

<jsonforms
  [(data)]="data"
  [schema]="schema"
  [uischema]="uiSchema"
  [renderers]="renderers">

<p><strong>Preview:</strong> {{ data?.comments | slice: 0:30 }}</p>
