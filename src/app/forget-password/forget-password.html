<div class="container mt-4">
  <h3>Forgot Password</h3>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate>
    <div formGroupName="credentials">
      <div class="mb-3">
        <label>Old Password</label>
        <input type="password" class="form-control" formControlName="oldPassword">
        <div class="text-danger"
          *ngIf="getControl('credentials.oldPassword')?.touched && getControl('credentials.oldPassword')?.invalid">
          Old password is required.
        </div>
      </div>

      <div class="mb-3">
        <label>New Password</label>
        <input type="password" class="form-control" formControlName="newPassword">
        <div *ngIf="getControl('credentials.newPassword')?.pending" class="text-info">Checking password...</div>
        <div class="text-danger" *ngIf="getControl('credentials.newPassword')?.errors?.['usedBefore']">Password was used
          before.</div>
        <div class="text-danger"
          *ngIf="getControl('credentials.newPassword')?.touched && getControl('credentials.newPassword')?.errors?.['minlength']">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" class="form-control" formControlName="confirmPassword">
      </div>

      <div class="text-danger" *ngIf="getControl('credentials')?.errors?.['mismatch']">
        Passwords do not match.
      </div>
    </div>

    <div formArrayName="securityQuestions" class="mt-4">
      <h5>Security Questions</h5>
      <div *ngFor="let q of securityQuestions.controls; let i=index" [formGroupName]="i"
        class="border p-2 mb-2 rounded bg-light">
        <div class="mb-2">
          <label>Question {{ i + 1 }}</label>
          <input class="form-control" formControlName="question">
        </div>
        <div class="mb-2">
          <label>Answer</label>
          <input class="form-control" formControlName="answer">
        </div>
        <button class="btn btn-danger btn-sm" (click)="removeSecurityQuestion(i)" type="button">Remove</button>
      </div>
      <button class="btn btn-secondary mt-2" type="button" (click)="addSecurityQuestion()">Add Question</button>
    </div>

    <div class="mt-4">
      <button class="btn btn-primary" [disabled]="loading || forgotPasswordForm.invalid">Submit</button>
      <img src="assets/loader.gif" width="30" *ngIf="loading" class="ms-3">
    </div>
  </form>
</div>
