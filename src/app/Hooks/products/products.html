<div class="mt-4">
    <div class="row">
        <div class="col-6">
            <div class="card">
                <div class="card-header bg-primary">
                    <h4 class="text-white">Products Add Form</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="productForm" (ngSubmit)="addProduct($event)">
                        <div class="form-group mb-2">
                            <label>Product Name</label>
                            <input type="text" class="form-control" formControlName="productName">
                        </div>
                        <div class="form-group mb-2">
                            <label>Quantity</label>
                            <input type="number" class="form-control" formControlName="quantity">
                        </div>
                        <div class="form-group mb-2">
                            <label>Price</label>
                            <input type="number" class="form-control" formControlName="price">
                        </div>
                        <div class="form-group mb-2">
                            <label>Active Date</label>
                            <input type="date" class="form-control" formControlName="activeDate">
                        </div>
                        <button class="btn btn-primary" type="submit">Add Product</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-6">
            <app-products-list [products]="products"></app-products-list>
        </div>
    </div>
</div>
